# SeatSync scale stack — nginx load balancer.
#
# Docker Compose runs this file in front of the `api` service's replicas. The
# API replicas publish no host ports, so this nginx is the only HTTP entrypoint
# (`/health`, `/events/*`, ...) and the only WebSocket entrypoint (`/ws`).
#
# Docker's embedded DNS answers `api` with one A record per replica. A variable
# `proxy_pass` makes nginx re-resolve that name through the resolver at request
# time (instead of resolving once at startup), so every request round-robins
# across all current replica addresses. Stateless routing is safe here because
# Redis pub/sub fans seat changes out to every instance (D31).

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # `$upstream_addr` in the access log proves which replica served a request;
    # the verification steps use it to show round-robin across both replicas.
    log_format upstream '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent upstream=$upstream_addr '
                        'rt=$request_time';

    access_log /var/log/nginx/access.log upstream;

    # WebSocket upgrade plumbing: echo `Upgrade` and turn `Connection` into
    # `upgrade` only when the client asked for an upgrade.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    # Preserve the protocol the browser used when nginx terminates TLS elsewhere.
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    server {
        listen 4000;
        server_name _;

        # Docker's embedded DNS server. A short validity makes nginx pick up
        # replicas that were added or removed by `docker compose up --scale`.
        resolver 127.0.0.11 valid=10s ipv6=off;

        # Variable hostname: forces runtime resolution and therefore round-robin
        # over every A record returned for `api`.
        set $api api:4000;

        # Shared proxy headers for REST and the WebSocket upgrade.
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # WebSocket connections are idle by design; keep them open far longer
        # than the server's 30 s ping/pong heartbeat and the 15 min token TTL.
        proxy_connect_timeout 5s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;

        # Longest-prefix match, so this wins over `location /`.
        location /ws {
            proxy_pass http://$api;
            proxy_buffering off;
        }

        location / {
            proxy_pass http://$api;
        }
    }
}
